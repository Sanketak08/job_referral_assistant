# ============================================================
# PEOPLE DISCOVERY
# ============================================================

people_search:
  provider: "tavily"

  endpoint_env: "SEARCH_API_URL"
  api_key_env: "SEARCH_API_KEY"
  auth_header_env: "SEARCH_API_AUTH_HEADER"

  max_results_per_query: 10
  max_queries: 8

  preferred_queries:
    - '"{company}" "{city}" "Engineering Manager"'
    - '"{company}" "{city}" "Backend Engineering Manager"'
    - '"{company}" "{city}" "Engineering Lead"'
    - '"{company}" "{city}" "Software Engineering Manager"'
    - '"{company}" "{country}" "Technical Recruiter"'
    - '"{company}" "{country}" "Internal Recruiter"'
    - '"{company}" "{city}" "Backend Engineer"'
    - '"{company}" "{city}" "Java Engineer"'

