# ============================================================
# APOLLO
# ============================================================

apollo:
  enabled: false
  api_key_env: "APOLLO_API_KEY"

  # Apollo is ONLY used for business-email enrichment.
  purpose: "business_email_enrichment"

  enrich_top_n: 3
  reveal_personal_emails: false
  reveal_phone_numbers: false

  never_guess_email: true
  require_verified_email: true

# ============================================================
# GEMINI
# ============================================================

gemini:
  api_key_env: "GEMINI_API_KEY"

  models:
    extraction:
      - "gemini-3.5-flash"
      - "gemini-3.1-flash-lite"
      - "gemini-3.8-flash"
      - "gemini-3.7-flash"
    ranking:
      - "gemini-3.5-flash"
      - "gemini-3.1-flash-lite"
      - "gemini-3.8-flash"
      - "gemini-3.7-flash"
    writing:
      - "gemini-3.5-flash"
      - "gemini-3.1-flash-lite"
      - "gemini-3.8-flash"
      - "gemini-3.7-flash"

  temperature:
    extraction: 0.1
    ranking: 0.2
    writing: 0.5

# ============================================================
# OUTREACH
# ============================================================

outreach:
  language: "English"

  max_email_words: 160
  max_linkedin_words: 80

  style:
    professional: true
    concise: true
    confident: true
    friendly: true
    direct: true
    natural: true

  include:
    job_title: true
    company_name: true
    relevant_skills: true
    contact_role: true
    one_specific_alignment_point: true
    relevant_project_or_impact: true

  avoid:
    generic_opening: true
    excessive_flattery: true
    resume_dump: true
    long_paragraphs: true
    exaggerated_claims: true

  avoid_phrases:
    - "Hope you're doing well"
    - "I am reaching out to express my interest"
    - "dream company"
    - "passionate about"
    - "I would be extremely grateful"
    - "I was thrilled to come across"
    - "I believe I would be a perfect fit"

  referral_request:
    direct: true
    polite: true
    ask_for_referral_if_employee: true

# ============================================================
# EMAIL / GMAIL
# ============================================================

email:
  provider: "gmail"
  from_name: "Sanket Kulkarni"

  max_emails_per_job: 1
  max_emails_per_company: 1

  auto_send: false
  require_approval: true

# ============================================================
# LINKEDIN
# ============================================================

linkedin:
  enabled: true
  generate_message: true

  auto_send: false
  require_manual_send: true

# ============================================================
# SAFETY / QUALITY
# ============================================================

safety:
  minimum_contact_confidence: 0.85
  minimum_company_match: 0.80

  never_guess_email: true
  skip_personal_email: true

  skip_generic_email:
    - "info@"
    - "support@"
    - "admin@"
    - "contact@"
    - "hello@"

  duplicate_contact_check: true
  maximum_outreach_per_company: 2
  require_business_email: true

# ============================================================
# TRACKING
# ============================================================

tracking:
  database: "sqlite"

  save:
    - "job"
    - "company"
    - "contact"
    - "email"
    - "linkedin_message"
    - "timestamp"
    - "status"

  statuses:
    - "discovered"
    - "matched"
    - "contact_found"
    - "email_found"
    - "drafted"
    - "approved"
    - "sent"
    - "replied"
    - "rejected"
    - "do_not_contact"

# ============================================================
# SYSTEM
# ============================================================

system:
  timezone: "Asia/Kolkata"

  dry_run: true

  logging:
    level: "INFO"

  retry:
    max_attempts: 3
    backoff_seconds: 2

  output:
    save_run_history: true
    history_path: "./data/run_history.jsonl"
